plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.jasem.ply'
    compileSdk 34

    defaultConfig {
        applicationId "ir.jasem.ply"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file("release-key.jks")
            storePassword "jasem123456"
            keyAlias "jasem_key"
            keyPassword "jasem123456"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
