name: Build Standalone Offline Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & Build Offline 3D Bundle
        run: |
          npm install
          npm run build
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compile Standalone Offline APK (Release & Debug)
        working-directory: ./android
        run: gradle assembleRelease assembleDebug

      - name: Upload Ready-to-Install KamanDuel3D.apk
        uses: actions/upload-artifact@v4
        with:
          name: KamanDuel3D-Standalone-Offline-APK
          path: android/app/build/outputs/apk/release/app-release.apk
