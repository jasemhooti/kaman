name: Build Standalone Signed Android APK (جنگ تانک ها - ir.jasem.ply)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Pre-Bundled Offline Game Assets & Real Release Keystore
        run: |
          if [ ! -f "android/app/release-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore android/app/release-key.jks \
              -alias jasem_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass jasem123456 \
              -keypass jasem123456 \
              -dname "CN=Jasem, OU=GameStudio, O=JasemPly, L=Tehran, ST=Tehran, C=IR"
          fi
          if [ -f "android/app/src/main/assets/www/index.html" ]; then
            echo "Found pre-bundled 100% offline index.html in android/app/src/main/assets/www/"
            ls -lh android/app/src/main/assets/www/index.html
          else
            echo "Building web bundle with public npm fallback..."
            node -e '
              const fs = require("fs");
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              delete pkg.dependencies["@google/genai"];
              delete pkg.dependencies["express"];
              delete pkg.dependencies["dotenv"];
              pkg.dependencies["vite"] = "^6.2.0";
              pkg.dependencies["@vitejs/plugin-react"] = "^4.3.4";
              pkg.dependencies["@tailwindcss/vite"] = "^4.0.9";
              pkg.dependencies["tailwindcss"] = "^4.0.9";
              pkg.devDependencies["typescript"] = "^5.7.3";
              pkg.devDependencies["tailwindcss"] = "^4.0.9";
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            '
            npm install --legacy-peer-deps
            npm run build
            mkdir -p android/app/src/main/assets/www
            cp -r dist/* android/app/src/main/assets/www/
          fi

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Signed Standalone Offline Release APK (ir.jasem.ply)
        working-directory: ./android
        run: gradle assembleRelease --no-daemon

      - name: Upload Signed APK Artifact (آماده کافه‌بازار و مایکت)
        uses: actions/upload-artifact@v4
        with:
          name: TankWars3D-ir.jasem.ply-Signed-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
